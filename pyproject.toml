[build-system]
requires = ["packaging", "setuptools>=49.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests", "experiments/test_paper_diagnostics.py", "experiments/test_mopd_teacher_topologies.py"]
asyncio_mode = "auto"
addopts = "--strict-markers"

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
